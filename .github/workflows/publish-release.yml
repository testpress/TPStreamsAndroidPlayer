name: Publish GitHub Release

on:
  push:
    tags:
      - '[0-9]*'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Commit SHA, branch, or tag (leave empty for selected branch/tag)'
        required: false
        default: ''
        type: string
      version:
        description: 'Version override (auto-detected from tag if empty)'
        required: false
        default: ''
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: Resolve commit SHA
        id: sha
        run: echo "COMMIT_SHA=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Determine version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "VERSION=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ github.event.inputs.ref }}" ]; then
            REF="${{ github.event.inputs.ref }}"
            # Strip refs/tags/ prefix if present, then strip v prefix
            VERSION="${REF#refs/tags/}"
            VERSION="${VERSION#v}"
            echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "VERSION=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "VERSION=1.2.1" >> "$GITHUB_OUTPUT"
          fi

      - name: Build test APK
        run: ./gradlew assembleDebug -PisTestApk=true -PVERSION_NAME=${{ steps.version.outputs.VERSION }}

      - name: Locate and rename APK
        id: apk
        run: |
          APK=$(find app/build/outputs/apk/debug -name "*.apk" | head -1)
          DEST="app/build/outputs/apk/debug/${{ steps.version.outputs.VERSION }}.apk"
          if [ "$APK" != "$DEST" ]; then
            mv "$APK" "$DEST"
          fi
          echo "PATH=$DEST" >> "$GITHUB_OUTPUT"

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: test-apk-${{ steps.version.outputs.VERSION }}
          path: ${{ steps.apk.outputs.PATH }}

      - name: Extract release notes from CHANGELOG.md
        id: release_notes
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        run: |
          python3 -c "
          import os, re, sys

          raw_version = sys.argv[1]
          ver = raw_version.lstrip('v').strip()

          # Match: ## [1.2.16] or ## 1.2.16 or ## [v1.2.16] with optional date
          header_pattern = re.compile(rf'^##\s+\[?v?{re.escape(ver)}\]?(?:\s*[-–—]\s*|\s+|$)', re.IGNORECASE)
          next_header_pattern = re.compile(r'^##\s+')
          link_footer_pattern = re.compile(r'^\[[^\]]+\]:\s*http')

          lines = []
          recording = False

          try:
              with open('CHANGELOG.md', 'r', encoding='utf-8') as f:
                  for line in f:
                      if recording:
                          if next_header_pattern.match(line) or link_footer_pattern.match(line):
                              break
                          lines.append(line)
                      elif header_pattern.match(line.strip()):
                          recording = True
          except Exception as e:
              print(f'Error reading CHANGELOG.md: {e}', file=sys.stderr)

          notes = ''.join(lines).strip()
          github_output = os.environ.get('GITHUB_OUTPUT')

          if notes:
              with open('RELEASE_NOTES.md', 'w', encoding='utf-8') as f:
                  f.write(notes + '\n')
              if github_output:
                  with open(github_output, 'a', encoding='utf-8') as f:
                      f.write('has_notes=true\n')
          else:
              if github_output:
                  with open(github_output, 'a', encoding='utf-8') as f:
                      f.write('has_notes=false\n')
          " "${{ steps.version.outputs.VERSION }}"

      - name: Upload APK to release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.version.outputs.VERSION }}
          tag_name: ${{ steps.version.outputs.VERSION }}
          target_commitish: ${{ steps.sha.outputs.COMMIT_SHA }}
          body_path: ${{ steps.release_notes.outputs.has_notes == 'true' && 'RELEASE_NOTES.md' || '' }}
          generate_release_notes: ${{ steps.release_notes.outputs.has_notes != 'true' }}
          files: ${{ steps.apk.outputs.PATH }}
